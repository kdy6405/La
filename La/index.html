 const bomb=pl.bomb;pl.bomb=false;let face=pgFace(pl,true);
 while(face===1&&pl.save>0){pl.save--;pgL(g,`🛟 ${nm}: 1이 나왔지만 구원! 다시 굴린다`);face=pgFace(pl,true)}
 pl.rolls++;g.last={p,face};
 if(face===1){pgL(g,`🎲 ${nm}: 1! 이번 턴 ${pl.turnPts}점 증발`);if(bomb){pl.score=Math.max(0,pl.score-10);pgL(g,'💣 폭탄! 총점 −10')}pl.extra=false;pgEnd(g);return g.last}
 const pts=face*(pl.dbl?2:1);if(pl.dbl)pgL(g,'✨ 더블!');pl.dbl=false;pl.turnPts+=pts;pgL(g,`🎲 ${nm}: ${face}${pts!==face?` ×2 = ${pts}`:''} → 이번 턴 ${pl.turnPts}점`);
 if(pl.trap&&pl.turnPts>pl.trap){pgL(g,`🪤 함정! ${nm}의 이번 턴 점수가 0`);pl.turnPts=0;pl.extra=false;pgEnd(g)}
 return g.last}
function pgHold(g){if(g.over)return false;const p=g.turn,pl=g.P[p],nm=pgName(g,p);if(pl.turnPts<=0)return false;
 pl.score+=pl.turnPts;pgL(g,`✋ ${nm} 멈춤! +${pl.turnPts} → 총 ${pl.score}점`);
 if(pl.score>=g.goal){g.over=true;g.winner=p;pgL(g,`🏆 ${nm} 승리!`);return true}
 if(pl.extra){pl.extra=false;g.extraNow=true}pgEnd(g);return true}
function pgChk(g,p){if(g.over)return;const a=g.P[p].score>=g.goal,b=g.P[1-p].score>=g.goal;if(a||b){g.over=true;g.winner=a?p:1-p;pgL(g,`🏆 ${pgName(g,g.winner)} 승리!`)}}
function pgPlay(g,p,idx,opt){if(g.over||g.turn!==p)return{ok:false,msg:'내 차례가 아니에요'};const pl=g.P[p],o=g.P[1-p];
 if(pl.used)return{ok:false,msg:'한 턴에 카드는 1장만 쓸 수 있어요'};const id=pl.hand[idx];if(!id)return{ok:false,msg:'카드가 없어요'};
 const c=PGC.find(x=>x.id===id),nm=pgName(g,p);pl.hand.splice(idx,1);pl.used=true;pgL(g,`🃏 ${nm}: ${c.e} ${c.n}`);
 const hit=fn=>{if(o.shield>0){o.shield--;pgL(g,'🛡 방패가 막았다!');return}fn()};
 switch(id){
  case'curse':hit(()=>o.mods.push({add:.2,n:3}));break;
  case'luck':pl.mods.push({add:-.1,n:3});break;
  case'precise':pl.force={t:'faces',f:[4,5,6]};break;
  case'chaos':hit(()=>{o.force={t:'chaos'}});break;
  case'peek':{const f=pgFace(pl,false);pl.peek=f;pl.force=null;break}
  case'save':pl.save++;break;
  case'shield':pl.shield++;break;
  case'bonus':pl.turnPts+=8;break;
  case'double':pl.dbl=true;break;
  case'gift':pl.score+=5;pgChk(g,p);break;
  case'steal':hit(()=>{const t=Math.min(6,o.score);o.score-=t;pl.score+=t;pgChk(g,p)});break;
  case'freeze':hit(()=>{o.score=Math.max(0,o.score-10)});break;
  case'stakeup':hit(()=>{o.mult=Math.min(8,o.mult*2)});break;
  case'bind':hit(()=>{o.bindNext=3});break;
  case'bomb':hit(()=>{o.bomb=true});break;
  case'trap':hit(()=>{o.trapNext=15});break;
  case'swap':hit(()=>{[pl.score,o.score]=[o.score,pl.score];pgChk(g,p)});break;
  case'extra':pl.extra=true;break;
  case'dom':hit(()=>{o.mult=Math.min(8,Math.max(o.mult,opt||2))});break;
  case'safe':pl.mult=Math.max(.25,pl.mult*.5);break}
 return{ok:true,card:c}}
function aiPickCard(g,me){const pl=g.P[me],o=g.P[1-me],lead=pl.score-o.score;let best=null,bs=0;
 pl.hand.forEach((id,idx)=>{let s=0,opt;
  switch(id){case'dom':s=95;opt=lead>=0?4:3;break;case'swap':s=(o.score-pl.score>=25)?90:0;break;case'steal':s=o.score>=12?45:10;break;case'freeze':s=o.score>=15?48:8;break;
   case'extra':s=55;break;case'curse':s=50;break;case'chaos':s=36;break;case'bomb':s=o.score>=10?42:30;break;case'trap':s=38;break;case'bind':s=36;break;
   case'stakeup':s=lead>=-10?62:30;break;case'safe':s=lead<=-20?72:0;break;case'luck':s=46;break;case'precise':s=50;break;case'peek':s=34;break;case'save':s=44;break;
   case'shield':s=(!pl.shield&&pl.hand.length>=3)?32:0;break;case'bonus':s=44;break;case'double':s=40;break;case'gift':s=38;break}
  if(o.shield>0&&PGC.find(c=>c.id===id).h)s*=.4;
  s+=rnd(0,10);if(s>bs){bs=s;best={idx,opt}}});
 return bs>=30?best:null}
function aiShouldHold(g,me){const pl=g.P[me],o=g.P[1-me];
 if(pl.turnPts<=0)return false;if(pl.score+pl.turnPts>=g.goal)return true;
 if(pl.maxRolls&&pl.rolls>=pl.maxRolls)return true;
 if(pl.peek===1&&pl.save<1)return true;
 const p1=pgP1(pl,false);let thr=p1<=.001?999:4*(1-p1)/p1;
 if(o.score>=g.goal-15)thr*=1.5;if(pl.trap)thr=Math.min(thr,pl.trap-4);
 thr+=rnd(-3,3);return pl.turnPts>=thr}
